name: Test Runner

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  pre-commit:
    name: Run pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install --default 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Run pre-commit checks
        run: uvx pre-commit run --show-diff-on-failure --all-files

  test:
    needs: pre-commit # This ensures tests run after pre-commit checks
    name: Execute tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run pytest -v
